<html>

    <style>
        h1 {color:rgba(25, 52, 227, 0.667)}
        .p_back{text-align:center;line-height:30px;margin-top:50px;background-color:rgba(0, 174, 255, 0.437);color:white}
        .p_back2{font-size:20px;font-weight:bold;color:blue}
         ul li{float:left;width:100px}

        .tooltip{
            position:relative;
            display:inline-block;
            border-bottom:1px dotted black;/* add dots under the hoverable text */
            cursor;pointer;
        }

    .tooltiptext{
        visibility:hidden;/* hidden by default */
        width:150px;
        heigth:100px;
        border-radius:5px;
        background-color:grey;
        color:#ffffff;
        text-align:center;
        padding:5px 0;
        position:absolute;
        z-index:1; /* ensure tooltip is displayed above content */
    }    

    /* show the tooltip text on hover */
    .tooltip:hover .tooltiptext{
        visibility:visible;
    }
    </style>
    <body>
